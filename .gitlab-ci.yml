.git_setup:
    before_script:
      # Install git in container
      - apt-get update
      - apt-get install git -y
      # Set up Git credentials for access to Matrix Julia packages
      - echo "https://gitlab-ci-token:$CI_JOB_TOKEN@git.matrixresearch.com" > ~/.git-credentials
      - git config --global credential.helper store
      - export JULIA_PKG_USE_CLI_GIT=true
      # Add Matrix package registry 
      - | 
      julia --project=docs -e '
        using Pkg
        Pkg.Registry.add()  # Add general package registry first
        Pkg.Registry.add(Pkg.RegistrySpec(url="https://git.matrixresearch.com/Programs/alg/julia/julia_registry"))''

.script:
  script:
    - |
      julia --project=@. -e '
        using Pkg
        Pkg.build()
        Pkg.test(coverage=true)'

.coverage:
  coverage: /Test coverage (\d+\.\d+%)/
  after_script:
    - |
      julia -e '
        using Pkg
        Pkg.add("Coverage")
        using Coverage
        c, t = get_summary(process_folder())
        using Printf
        @printf "Test coverage %.2f%%\n" 100c / t'

Julia 1.12:
  image: julia:1.12
  extends:
    - .git_setup
    - .script
    - .coverage
  tags:
    - docker

pages:
  image: julia:1.12
  stage: deploy
  extends: .git_setup
  script:
    - |
      julia --project=docs -e '
        using Pkg
        Pkg.develop(PackageSpec(path=pwd()))
        Pkg.instantiate()
        using Documenter: doctest
        using RadarData
        doctest(RadarData)
        include("docs/make.jl")'
    - mv docs/build public
  artifacts:
    paths:
      - public
  only:
    - main
  tags:
    - docker